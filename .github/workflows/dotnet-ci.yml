name: .NET CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'
  SOLUTION_PATH: 'UrGuide.slnx'
  WEBAPP_PROJECT: 'UrGuide.WebApp/UrGuide.WebApp.csproj'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore ${{ env.WEBAPP_PROJECT }}
      
    - name: Build
      run: dotnet build ${{ env.WEBAPP_PROJECT }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
      
    - name: Restore test dependencies
      run: dotnet restore tests/UrGuide.UnitTests/UrGuide.UnitTests.csproj

    - name: Build tests
      run: dotnet build tests/UrGuide.UnitTests/UrGuide.UnitTests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Run tests
      run: dotnet test tests/UrGuide.UnitTests/UrGuide.UnitTests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
        
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always() && hashFiles('**/*.trx') != ''
      with:
        files: '**/*.trx'
        
    - name: Publish build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webapp-build
        path: ${{ github.workspace }}/UrGuide.WebApp/bin/${{ env.BUILD_CONFIGURATION }}/net10.0/
        retention-days: 5

  code-quality:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.WEBAPP_PROJECT }}
      
    - name: Build for CodeQL
      run: dotnet build ${{ env.WEBAPP_PROJECT }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      
  dependency-check:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.WEBAPP_PROJECT }}
      
    - name: Check for vulnerable packages
      run: |
        dotnet list ${{ env.WEBAPP_PROJECT }} package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
        if grep -q "has the following vulnerable packages" vulnerability-report.txt; then
          echo "⚠️ Vulnerable packages detected! Please review the report."
          cat vulnerability-report.txt
          exit 1
        else
          echo "✅ No vulnerable packages detected"
        fi
      continue-on-error: true
      
    - name: Upload vulnerability report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vulnerability-report
        path: vulnerability-report.txt
        retention-days: 30

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: urguide-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Test Docker image
      run: |
        docker build -t urguide-api:test .
        echo "✅ Docker image built successfully"

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, dependency-check, docker-build]
    if: always()
    permissions:
      contents: read
    
    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.build-and-test.result }}" != "success" ] || \
           [ "${{ needs.code-quality.result }}" != "success" ] || \
           [ "${{ needs.docker-build.result }}" != "success" ]; then
          echo "❌ CI/CD Pipeline failed!"
          echo "Build: ${{ needs.build-and-test.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Dependency Check: ${{ needs.dependency-check.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"
          exit 1
        else
          echo "✅ CI/CD Pipeline completed successfully!"
        fi
