# Docker Compose override for development
version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    volumes:
      - .:/src
      - ~/.nuget/packages:/root/.nuget/packages
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ApplicationUri=${APPLICATION_URI:-http://localhost:5000}
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      # Load secrets from environment variables (set in .env file)
      - IpStack__ApiKey=${IPSTACK_API_KEY}
      - SENDGRID_URGUIDE_API_KEY=${SENDGRID_API_KEY}
      - IdentityServer__Clients__Xamarin__ClientSecret=${XAMARIN_CLIENT_SECRET}
      # Admin user provisioning from .env file (overrides appsettings)
      - Seeding__SeedDefaultAdmin=${SEED_ADMIN_ENABLED:-true}
      - Seeding__AdminEmail=${ADMIN_EMAIL:-admin@urguide.local}
      - Seeding__AdminPassword=${ADMIN_PASSWORD:-Admin123!}
      - Seeding__AdminFirstName=${ADMIN_FIRST_NAME:-Admin}
      - Seeding__AdminLastName=${ADMIN_LAST_NAME:-User}
      - IdentityServer__Clients__AdminDashboard__ClientSecret=${ADMIN_DASHBOARD_CLIENT_SECRET:-dev-admin-dashboard-secret-change-in-production}
    command: dotnet watch run --no-launch-profile --project /src/UrGuide.WebApp/UrGuide.WebApp.csproj

  # Admin Dashboard development with hot reload
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile.dev
      target: development
    ports:
      - "3002:3001"
    volumes:
      - ./admin-dashboard:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_TARGET=http://api:80
    command: npm run dev -- --host
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
