version: '3.8'

services:
  # SQL Server database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: urguide-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SQL_SA_PASSWORD:-YourStrong@Passw0rd}
      - MSSQL_PID=Developer
    ports:
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - urguide-network
    healthcheck:
      test: ["CMD-SHELL", "if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -C -Q \"SELECT 1\"; else /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\"; fi"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: urguide-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI port
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - urguide-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Elasticsearch for advanced search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: urguide-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - urguide-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # UrGuide API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urguide-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ApplicationUri=${APPLICATION_URI:-http://localhost:5000}
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=urguide_data;User Id=sa;Password=${SQL_SA_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__AuthConnection=Server=sqlserver;Database=urguide_id4;User Id=sa;Password=${SQL_SA_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=true
      - IdentityServer__Clients__AdminDashboard__ClientSecret=${ADMIN_DASHBOARD_CLIENT_SECRET}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASS:-guest}
      - Elasticsearch__Url=http://elasticsearch:9200
      # Admin user provisioning from .env file
      - Seeding__SeedDefaultAdmin=${SEED_ADMIN_ENABLED:-false}
      - Seeding__AdminEmail=${ADMIN_EMAIL:-admin@urguide.local}
      - Seeding__AdminPassword=${ADMIN_PASSWORD:-Admin123!}
      - Seeding__AdminFirstName=${ADMIN_FIRST_NAME:-Admin}
      - Seeding__AdminLastName=${ADMIN_LAST_NAME:-User}
    ports:
      - "5000:80"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./wwwroot/uploads:/app/wwwroot/uploads
      - ./logs:/app/logs
    networks:
      - urguide-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Admin Dashboard
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: urguide-admin-dashboard
    ports:
      - "3001:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - urguide-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Guide Portal
  guide-portal:
    build:
      context: ./guide-portal
      dockerfile: Dockerfile
    container_name: urguide-guide-portal
    ports:
      - "3002:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - urguide-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  sqlserver-data:
    driver: local
  rabbitmq-data:
    driver: local
  elasticsearch-data:
    driver: local

networks:
  urguide-network:
    driver: bridge

